<script>/* start-screen background: animates only while #start is visible; one static frame with prefers-reduced-motion */
(()=>{const st=document.getElementById('start'),cv=document.getElementById('startBg');if(!st||!cv)return;const g=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)');let W=0,H=0,D=1,raf=0,last=0,T=0;const R=Math.random;
const COLS=['#2979ff','#ff1493','#ffd600','#00e676'],bricks=[],MAXB=16;let stacks=[];
const brick=a=>{const s=.7+R()*.6;return{x:R()*W,y:a?R()*H:-40,w:44*s,h:20*s,c:COLS[R()*4|0],vy:40+R()*55,r:(R()-.5)*.6,vr:(R()-.5)*.8,o:.35+R()*.3}};
const count=()=>bricks.length;
function init(){bricks.length=0;for(let i=0;i<MAXB;i++)bricks.push(brick(1));stacks=COLS.map((c,i)=>({c,n:2+((i*5+2)%3)}))}
function step(dt){for(const b of bricks){b.y+=b.vy*dt;b.r+=b.vr*dt;if(b.y>H+40)Object.assign(b,brick(0))}}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function glossy(x,y,w,h,c,o){g.globalAlpha=o;g.fillStyle=c;rr(x,y,w,h,h*.3);g.fill();g.lineWidth=2;g.strokeStyle='rgba(255,255,255,.85)';g.stroke();g.fillStyle='rgba(255,255,255,.45)';rr(x+w*.1,y+h*.14,w*.8,h*.24,h*.12);g.fill();g.globalAlpha=1}
function draw(){g.clearRect(0,0,W,H);
 g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;const gs=32;g.beginPath();for(let x=(T*6)%gs;x<W;x+=gs){g.moveTo(x,0);g.lineTo(x,H)}for(let y=(T*12)%gs;y<H;y+=gs){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
 for(const b of bricks){g.save();g.translate(b.x,b.y);g.rotate(b.r);glossy(-b.w/2,-b.h/2,b.w,b.h,b.c,b.o);g.restore()}
 const cw=W/4,bw=Math.min(56,cw*.55),bh=bw*.36;if(H>=700)stacks.forEach((s,i)=>{const x=cw*i+cw/2-bw/2;for(let k=0;k<s.n;k++){const bob=k===s.n-1?Math.sin(T*2+i)*1.5:0;glossy(x+(k%2?3:-3),H-6-(k+1)*(bh+4)+bob,bw,bh,s.c,.3)}})}

function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D|0;cv.height=H*D|0;g.setTransform(D,0,0,D,0,0);init()}
function frame(ts){raf=0;if(st.classList.contains('hide')||document.hidden)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;T+=dt;step(dt);draw();raf=requestAnimationFrame(frame)}
function kick(){if(st.classList.contains('hide'))return;if(RM.matches){draw();return}if(!raf){last=0;raf=requestAnimationFrame(frame)}}
new MutationObserver(kick).observe(st,{attributes:true,attributeFilter:['class']});document.addEventListener('visibilitychange',kick);
addEventListener('resize',()=>{size();draw()});RM.addEventListener&&RM.addEventListener('change',kick);size();draw();kick();
window.__startBg={get running(){return !!raf},get count(){return typeof count==='function'?count():0}};})();
</script>
<script>/* brick-letter title, rebuilt whenever the (translated) subtitle text changes */
(()=>{const src=document.getElementById('fbSub'),out=document.getElementById('fbWord');if(!src||!out)return;
const build=()=>{const txt=(src.textContent||'').trim().toUpperCase();if(out.dataset.t===txt)return;out.dataset.t=txt;out.textContent='';
 for(const w of txt.split(/\s+/)){if(!w)continue;const d=document.createElement('span');d.className='wd';for(const ch of w){const b=document.createElement('b');b.textContent=ch;d.appendChild(b)}out.appendChild(d)}};
new MutationObserver(build).observe(src,{childList:true,characterData:true,subtree:true});build();})();
</script>

const stackTopY=i=>S.groundY-S.cols[i].length*S.rh;
function shortestCol(){let m=Infinity,c=0;S.cols.forEach((s,i)=>{if(s.length<m){m=s.length;c=i}});return c}
function handleGesture(g){const b=S.cur;if(!b||b.state!=='fall')return;if(b.kind!=='bomb'&&b.age<(mode==='touch'?.15:.35))return;
  if(b.kind==='bomb'){ // only the defuse gesture matters; color gestures on a bomb are ignored (no penalty)
    if(g==='defuse'&&b.age>=(mode==='touch'?0:.2)){b.state='gone';S.hearts=Math.min(5,S.hearts+1);sfx.defuse();parts(b.x,b.y+S.fall.h/2,'#ddd',24,160);fx(b.x,b.y,t('defused'),'#7cf',20);S.spawnT=.45;ev('bomb')}
    return}

function boom(b){sfx.boom();parts(b.x,b.y+S.fall.h/2,'#ff9100',40,320);fx(b.x,b.y-20,t('boom'),'#ff9100',24)}

  const by=stackTopY(f.ci)+S.rh/2;S.squash=.18;S.squashCol=f.ci;

  if(f.c==='rainbow')S.chainN++;else if(!S.chainC||S.chainC===f.c){S.chainC=f.c;S.chainN++}else{S.chainC=f.c;S.chainN=1}
  if(S.chainN>=3){S.chainN=0;S.chainC=null;S.bursts++;const hex=f.c==='rainbow'?'#ffffff':COLORS[f.c].hi;
    for(let k=0;k<Math.min(3,col.length);k++)parts(cx,stackTopY(f.ci)+(k+.5)*S.rh,hex,20,260);
    S.score+=50;fx(W/2,H*.38,t('burst'),hex,22);S.slowT=3;sfx.burst();ev('chain');checkUnlock()}
  if(col.length>=MAXROWS)sinkCol(f.ci)}
function sinkCol(i){const bricks=S.cols[i];S.cols[i]=[];S.sinking.push({ci:i,bricks,t:0,dur:.9});sfx.crunch();S.shake=.3;
  S.sinks++;S.level++;S.score+=20;ev('sink');fx(colX(i),S.groundY-60,'+20','#ffd54a',26);sinkCelebrate(i);
  setTimeout(()=>{if(!S||S.ended)return;sfx.level();banner(t('sinkB',{c:t(COLORS[CKEYS[i]].n),n:S.level}),'#ffd54a',2);
    for(let k=0;k<26;k++)S.parts.push({x:colX(i)+(Math.random()-.5)*S.colW,y:S.groundY,vx:(Math.random()-.5)*200,vy:-Math.random()*220,t:.8,col:'#8d6e63',s:3+Math.random()*3})},700);
  checkUnlock();if(mode==='face'&&S.sinks%3===0)setTimeout(()=>{if(running&&!S.ended)startRest()},1200)}
const ease=x=>1-Math.pow(1-x,3);
function update(dt){
  if(S.offer)return; // waiting on the Continue? offer
  celebUpdate(dt);const frozen=S.freezeT>0;
  S.t+=dt;S.bannerT-=dt;S.shake=Math.max(0,S.shake-dt);S.squash=Math.max(0,(S.squash||0)-dt);S.slowT=Math.max(0,S.slowT-dt);
  if(S.overT>0){S.overT-=dt;if(S.overT<=0){endOrOffer();return}}
  const q=gestureQ;gestureQ=[];if(S.overT<0)for(const g of q)handleGesture(g);
  for(const s of S.sinking)s.t+=dt;S.sinking=S.sinking.filter(s=>s.t<s.dur);
  for(const f of S.fly){f.t+=dt;if(f.t>=f.dur&&!f.done){f.done=1;land(f)}}S.fly=S.fly.filter(f=>!f.done);
  const slow=S.slowT>0?.5:1,b=S.cur;
  if(!b||b.state==='gone'){if(S.overT<0){S.spawnT-=dt;if(S.spawnT<=0)spawnBrick()}}
  else if(frozen&&b.state==='fall'){} // record moment: falling (and the brick's value timer) freeze
  else{b.age+=dt;
    if(b.state==='fall'){b.y+=b.vy*slow*dt;
      if(b.y+S.fall.h>=S.deadY){if(b.kind==='bomb'){b.state='gone';boom(b);loseHeart(t('slow'))}
        else{b.state='shatter';b.st=.5;sfx.shatter();parts(b.x,b.y+S.fall.h,COLORS[b.c].hex,26,260);loseHeart(t('slow'))}S.spawnT=.7}}
    else if(b.state==='shatter'){b.st-=dt;if(b.st<=0)b.state='gone'}}
  for(const f of S.fx){f.t-=dt;f.y-=40*dt}S.fx=S.fx.filter(f=>f.t>0);
  const pd=frozen?dt*.5:dt;for(const p of S.parts){p.t-=pd;if(p.conf){p.vx*=1-pd*1.5;p.vy=p.vy*(1-pd*1.5)+260*pd;p.rot+=p.vr*pd}else p.vy+=(p.star?40:p.spark?160:500)*pd;p.x+=p.vx*pd;p.y+=p.vy*pd}S.parts=S.parts.filter(p=>p.t>0);
  if(S.parts.length>MAXPARTS)S.parts.splice(0,S.parts.length-MAXPARTS); // cap for phone performance
}

function confetti(x,y,col,n){const cols=[col,'#ffffff',col,'#ffd54a'];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6,v=320+Math.random()*380;

function rr(x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawBrick(cx,y,w,h,c,kind,st,opt={}){
  const x=cx-w/2,rb=c==='rainbow'||kind==='rainbow',col=rb?null:COLORS[c],gold=kind==='golden';
  const hex=gold?'#ffc400':col?col.hex:'#ffffff',hi=gold?'#fff3b0':col?col.hi:'#ffffff',A=opt.alpha??1;
  ctx.save();ctx.globalAlpha=A;
  if(opt.rot){ctx.translate(cx,y+h/2);ctx.rotate(opt.rot);ctx.translate(-cx,-(y+h/2))}
  if(kind==='bomb'){ctx.shadowColor='#ff5252';ctx.shadowBlur=16;ctx.fillStyle='#212121';ctx.beginPath();ctx.arc(cx,y+h/2,h*.62,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ff5252';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='#bcaaa4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+h*.3,y);ctx.quadraticCurveTo(cx+h*.6,y-h*.4,cx+h*.8,y-h*.2);ctx.stroke();
    ctx.fillStyle=Math.sin(performance.now()/60)>0?'#ffeb3b':'#ff6d00';ctx.beginPath();ctx.arc(cx+h*.8,y-h*.2,4,0,7);ctx.fill();
    ctx.font=Math.round(h*.55)+'px '+EMOJI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💣',cx,y+h/2+1);ctx.restore();return}
  const fill=rb?rainbowGrad(x,w):hex,r=st==='candy'?h*.45:st==='gems'?3:7;
  if(st==='neon'){ctx.shadowColor=rb?'#fff':hex;ctx.shadowBlur=18;rr(x+2,y+2,w-4,h-4,r);ctx.fillStyle='rgba(10,6,24,.92)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=fill;ctx.stroke();ctx.shadowBlur=0;
    rr(x+7,y+7,w-14,h-14,r-3);ctx.lineWidth=1.5;ctx.strokeStyle=rb?fill:hi;ctx.stroke()}
  else{ctx.shadowColor=rb?'#fff':hex;ctx.shadowBlur=st==='gems'?20:14;rr(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.shadowBlur=0;
    ctx.save();rr(x,y,w,h,r);ctx.clip();
    if(st==='candy'){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=h*.22;for(let i=-h;i<w+h;i+=h*.75){ctx.beginPath();ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);ctx.stroke()}
      ctx.fillStyle='rgba(255,255,255,.6)';rr(x+h*.35,y+h*.14,w-h*.7,h*.18,h*.09);ctx.fill()}
    else if(st==='gems'){ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w*.78,y+h*.35);ctx.lineTo(x+w*.22,y+h*.35);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w*.78,y+h*.65);ctx.lineTo(x+w*.22,y+h*.65);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*.22,y+h*.35);ctx.lineTo(x+w*.22,y+h*.65);ctx.lineTo(x,y+h);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w*.78,y+h*.35);ctx.lineTo(x+w*.78,y+h*.65);ctx.lineTo(x+w,y+h);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+w*.84,y+h*.2,2.2,0,7);ctx.fill()}
    else{ctx.fillStyle=rb?'rgba(255,255,255,.4)':hi;ctx.globalAlpha=A*.75;rr(x+8,y+4,w-16,h*.22,4);ctx.fill();ctx.globalAlpha=A;ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x,y+h*.78,w,h*.22)}
    ctx.restore();rr(x,y,w,h,r);ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke()}
  if(gold&&col){ctx.lineWidth=4;ctx.strokeStyle=col.hex;rr(x+5,y+5,w-10,h-10,4);ctx.stroke()}
  if(OPT.cb&&col&&!opt.noPat){const s=Math.min(h*.5,18),dk=st!=='neon'&&(c==='yellow'||c==='green');if(opt.icon)[-1,1].forEach(d=>drawPat(c,cx+d*w*.35,y+h/2,s,dk));else drawPat(c,cx,y+h/2,s,dk)}
  if(opt.icon){ctx.font=Math.round(h*.55)+'px '+EMOJI_FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';
    if(rb)ctx.fillText('🌈',cx,y+h/2+1);else if(gold){ctx.fillText('⭐',cx-h*.45,y+h/2+1);ctx.fillText(col.ic,cx+h*.45,y+h/2+1)}else ctx.fillText(col.ic,cx,y+h/2+1)}

function heart(x,y,s,on){ctx.save();ctx.fillStyle=on?'#ff1744':'#3b2f4a';ctx.shadowColor='#ff1744';ctx.shadowBlur=on?8:0;ctx.beginPath();

const GICON={blink2:'👀',jaw:'😮',smile:'😁',brow:'🤨',defuse:'💣'};
const gName=g=>g==='defuse'?t('gDefuse'):t(COLORS[G2C[g]].gn);
function draw(){
  const gy=S.groundY,rh=S.rh;ctx.save();
  if(S.shake>0)ctx.translate((Math.random()-.5)*S.shake*18,(Math.random()-.5)*S.shake*12);
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#05030c');gr.addColorStop(.7,'#0d0820');gr.addColorStop(1,'#140c04');ctx.fillStyle=gr;ctx.fillRect(-20,-20,W+40,H+40);
  if(S.slowT>0){ctx.fillStyle='rgba(41,121,255,'+(.1*Math.min(1,S.slowT))+')';ctx.fillRect(-20,-20,W+40,H+40)}
  // column lanes, each tinted with its color
  CKEYS.forEach((k,i)=>{const x=S.colW*i,c=COLORS[k];const lg=ctx.createLinearGradient(0,S.zoneTop,0,gy);lg.addColorStop(0,c.hex+'00');lg.addColorStop(1,c.hex+'2a');ctx.fillStyle=lg;ctx.fillRect(x+3,S.zoneTop,S.colW-6,gy-S.zoneTop);
    ctx.strokeStyle=c.hex+'55';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x+3,S.zoneTop);ctx.lineTo(x+3,gy);ctx.moveTo(x+S.colW-3,S.zoneTop);ctx.lineTo(x+S.colW-3,gy);ctx.stroke();ctx.setLineDash([])});
  // red deadline
  ctx.strokeStyle='rgba(255,82,82,.75)';ctx.lineWidth=2;ctx.setLineDash([10,7]);ctx.beginPath();ctx.moveTo(0,S.deadY);ctx.lineTo(W,S.deadY);ctx.stroke();ctx.setLineDash([]);
  // ground + labels
  const gg=ctx.createLinearGradient(0,gy,0,H);gg.addColorStop(0,'#3e2723');gg.addColorStop(1,'#120a04');ctx.fillStyle=gg;ctx.fillRect(-20,gy,W+40,H-gy+20);
  ctx.fillStyle='#ffd54a';ctx.shadowColor='#ffd54a';ctx.shadowBlur=10;ctx.fillRect(-20,gy,W+40,3);ctx.shadowBlur=0;
  ctx.textAlign='center';ctx.textBaseline='middle';
  CKEYS.forEach((k,i)=>{const c=COLORS[k],cx=colX(i);ctx.fillStyle=c.hex;ctx.shadowColor=c.hex;ctx.shadowBlur=8;ctx.font='bold 12px sans-serif';
    ctx.fillText((mode==='touch'?'':c.ic+' ')+t(c.n)+' '+S.cols[i].length+'/'+MAXROWS,cx,gy+16);ctx.shadowBlur=0;
    if(mode!=='touch'){ctx.fillStyle='#ccc';ctx.font='10px sans-serif';ctx.fillText(t(c.gn),cx,gy+32)}});
  // stacks (clipped at the ground so sinking stacks disappear into it)
  ctx.save();ctx.beginPath();ctx.rect(-20,-20,W+40,gy+20);ctx.clip();
  for(const s of S.sinking){const so=Math.pow(Math.min(1,s.t/s.dur),2)*(MAXROWS*rh+10);s.bricks.forEach((r,j)=>drawBrick(colX(s.ci),gy-(j+1)*rh+so+1,S.cw,rh-2,r.c,r.kind,style))}
  S.cols.forEach((col,i)=>col.forEach((r,j)=>{let y=gy-(j+1)*rh,h=rh-2;if(j===col.length-1&&S.squash>0&&S.squashCol===i){const k=S.squash/.18;y+=k*4;h-=k*4}drawBrick(colX(i),y+1,S.cw,h,r.c,r.kind,style)}));
  ctx.restore();
  for(const s of S.sinking)for(let k=0;k<3;k++){ctx.fillStyle='rgba(141,110,99,.7)';ctx.beginPath();ctx.arc(colX(s.ci)+(Math.random()-.5)*S.colW,gy+Math.random()*8,3+Math.random()*5,0,7);ctx.fill()}
  // flying bricks (arc from the drop zone to their stack, shrinking to stack size)
  for(const f of S.fly){const p=ease(Math.min(1,f.t/f.dur)),tx=colX(f.ci),ty=stackTopY(f.ci)-rh;
    const x=f.x0+(tx-f.x0)*p,y=f.y0+(ty-f.y0)*p-Math.sin(p*Math.PI)*60,w=S.fall.w+(S.cw-S.fall.w)*p,h=S.fall.h+(rh-2-S.fall.h)*p;
    ctx.globalAlpha=.25;drawBrick(f.x0+(tx-f.x0)*Math.max(0,p-.15),f.y0+(ty-f.y0)*Math.max(0,p-.15)-Math.sin(Math.max(0,p-.15)*Math.PI)*60,w,h,f.c,f.kind,style);ctx.globalAlpha=1;
    drawBrick(x,y,w,h,f.c,f.kind,style,{rot:(1-p)*.3*Math.sign(tx-f.x0)})}

    if(b.state==='shatter'){ctx.save();ctx.translate((Math.random()-.5)*8,0);drawBrick(b.x,b.y,FW,FH,b.c,b.kind,style,{alpha:Math.max(0,b.st*2),icon:1});
      ctx.strokeStyle='#ff5252';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x-FW*.3,b.y);ctx.lineTo(b.x-FW*.05,b.y+FH*.6);ctx.lineTo(b.x+FW*.2,b.y+FH*.2);ctx.lineTo(b.x+FW*.35,b.y+FH);ctx.stroke();ctx.restore()}
    else{drawBrick(b.x,b.y,FW,FH,b.c,b.kind,style,{icon:1});
      if(b.kind!=='bomb'&&b.state==='fall'){const v=brickValue(b),p=fallProgress(b),col=valCol(p),vx=b.x+FW/2+12,vy=b.y+FH/2;
        // live point value badge, counting down as the brick descends
        ctx.font='bold 22px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';const tw=ctx.measureText(String(v)).width;
        ctx.fillStyle='rgba(0,0,0,.55)';rr(vx-6,vy-17,tw+12+(S.mult>1?28:0),34,10);ctx.fill();
        ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=p<.5?10:0;ctx.fillText(String(v),vx,vy+1);ctx.shadowBlur=0;
        if(S.mult>1){ctx.font='bold 13px sans-serif';ctx.fillStyle='#ff6ec7';ctx.fillText('x'+S.mult,vx+tw+4,vy+2)}
        // thin drain bar under the brick
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(b.x-FW/2,b.y+FH+5,FW,4);ctx.fillStyle=col;ctx.fillRect(b.x-FW/2,b.y+FH+5,FW*(1-p),4)}}
    if(b.kind==='bomb'&&b.state==='fall'){const cy=b.y+FH/2,R=FH*.62+10;
      // hint pill above the bomb (face mode only)
      if(mode==='face'){const hint=t('puffBomb');ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const hw=ctx.measureText(hint).width+24;
      ctx.fillStyle='rgba(255,82,82,.9)';rr(b.x-hw/2,b.y-46,hw,26,13);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(hint,b.x,b.y-33)} // touch mode: no banner, just tap the bomb
      // progress ring while the defuse gesture is held (face mode)
      ctx.lineWidth=4;ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(b.x,cy,R,0,7);ctx.stroke();
      if(mode==='face'&&DEF.prog>0){ctx.strokeStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(b.x,cy,R,-Math.PI/2,-Math.PI/2+DEF.prog*Math.PI*2);ctx.stroke();ctx.shadowBlur=0}}}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of S.parts){ctx.globalAlpha=Math.max(0,Math.min(1,p.t*1.5));ctx.fillStyle=p.col;if(p.star){ctx.font='14px sans-serif';ctx.fillText('✦',p.x,p.y)}else if(p.conf){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}else ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}ctx.globalAlpha=1;
  for(const f of S.fx){ctx.globalAlpha=Math.max(0,Math.min(1,f.t));ctx.fillStyle=f.col;ctx.font='bold '+f.size+'px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillText(f.txt,f.x,f.y)}ctx.globalAlpha=1;
  ctx.restore();
  // HUD
  const top=14+(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#ffd54a';ctx.font='bold '+Math.round(26*(1+S.scorePulse*.8))+'px sans-serif';ctx.shadowColor='#ffd54a';ctx.shadowBlur=8+S.scorePulse*40;ctx.fillText(String(S.score),12,top+10);ctx.shadowBlur=0;
  for(let i=0;i<5;i++)heart(22+i*24,top+28,18,i<S.hearts);
  ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText(t('level')+' '+S.level+(S.relax?'  '+t('relaxHud'):'')+(S.boost?'  ⭐':''),12,top+62);
  let hy=top+86;
  if(S.mult>1){ctx.fillStyle='#ff6ec7';ctx.font='bold 20px sans-serif';ctx.shadowColor='#ff1493';ctx.shadowBlur=10;ctx.fillText('x'+S.mult+' COMBO',12,hy);ctx.shadowBlur=0;hy+=22}
  if(S.chainN>=1&&S.chainC){ctx.font='12px sans-serif';ctx.fillStyle=COLORS[S.chainC].hex;ctx.fillText('●'.repeat(S.chainN)+'○'.repeat(3-S.chainN),12,hy);hy+=18}
  if(S.daily){ctx.fillStyle='#9cf';ctx.font='12px sans-serif';ctx.fillText('📅 '+S.day,12,hy)}
  if(S.next){const nx=W-196,ny=top+62;ctx.fillStyle='#ccc';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(t('next'),nx-4,ny+11);drawBrick(nx+30,ny,60,22,S.next.c,S.next.kind,style,{})}
  if(S.bannerT>0){ctx.textAlign='center';ctx.globalAlpha=Math.min(1,S.bannerT*2);let bf=22;ctx.font='bold 22px sans-serif';while(bf>12&&ctx.measureText(S.banner).width>W-24){bf--;ctx.font='bold '+bf+'px sans-serif'}ctx.fillStyle=S.bannerCol||'#ffd54a';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=14;
    ctx.fillText(S.banner,W/2,S.spawnY-18);ctx.shadowBlur=0;ctx.globalAlpha=1}
  drawCelebrations();

  if(mode==='face'&&running){const iy=gy+62,now=performance.now();let txt='',prog=0,col='#fff';
    if(GE.last&&now-GE.lastT<600){txt=GICON[GE.last]+' ✓ '+gName(GE.last);col='#00e676';prog=1}
    else if(DEF.prog>0&&bombFalling()){txt=(DEF.src==='shake'?'↔️ ':'😤 ')+t('gDefuse');prog=DEF.prog;col='#00e676'}
    else if(GE.cur){txt=GICON[GE.cur]+' '+gName(GE.cur);prog=Math.min(1,GE.heldT/HOLD[GE.cur]);col='#ffd54a'}
    else if(GE.blinks.length){txt='👀 '+t('gBlink1');prog=.5;col='#82b1ff'}
    if(txt){ctx.textAlign='center';ctx.font='bold 14px sans-serif';const w=Math.max(150,ctx.measureText(txt).width+30);ctx.fillStyle='rgba(0,0,0,.6)';rr(W/2-w/2,iy-14,w,28,14);ctx.fill();
      ctx.fillStyle=col;ctx.globalAlpha=.4;rr(W/2-w/2,iy-14,Math.max(28,w*prog),28,14);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillText(txt,W/2,iy+1)}

  drawHud()}
document.documentElement.style.setProperty('--sat','env(safe-area-inset-top)');
function step(now){requestAnimationFrame(step);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!running)return;updateInput(dt);if(!paused&&!S.ended)update(dt);if(running)draw()}

// ---------- Styles screen ----------
function buildStyles(){const g=$('styleGrid');g.innerHTML='';const ts=topScore();
  for(const s of STYLES){const bt=document.createElement('button'),c=document.createElement('canvas');c.width=280;c.height=120;bt.appendChild(c);
    const lb=document.createElement('span');const ok=styleOK(s),sk=Object.keys(STREAK_REW).find(n=>STREAK_REW[n]===s.k);lb.textContent=ok?t(s.n):t(s.n)+' '+t('needPts',{n:s.need})+(sk?' '+t('needStreak',{n:sk}):'');bt.appendChild(lb);
    bt.disabled=!ok;if(style===s.k)bt.classList.add('sel');bt.onclick=()=>{style=s.k;localStorage.setItem('fb_style',style);buildStyles()};g.appendChild(bt);
    const c2=c.getContext('2d');c2.scale(2,2);const o=ctx;ctx=c2;
    try{drawBrick(38,8,62,22,'blue','normal',s.k);drawBrick(102,8,62,22,'pink','normal',s.k);drawBrick(38,34,62,22,'yellow','normal',s.k);drawBrick(102,34,62,22,'green','normal',s.k)}finally{ctx=o}}}
$('bStyle').onclick=()=>{buildStyles();buildBadges();$('styles').classList.remove('hide');$('styles').scrollTop=0};$('bStyleOk').onclick=()=>$('styles').classList.add('hide');

// ---------- Meta: settings, daily streak, chapters & missions, badges, continue offer ----------
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// settings (colorblind patterns default ON)
let OPT=Object.assign({cb:true,relax:false},LS.get('fb_opts',{}));
function buildSettings(){for(const [id,k] of [['tCb','cb'],['tRelax','relax']]){const b=$(id);b.textContent=OPT[k]?t('on'):t('off');b.classList.toggle('off',!OPT[k])}document.body.classList.toggle('nocb',!OPT.cb)}
function setOpt(k,v){OPT[k]=v;LS.set('fb_opts',OPT);buildSettings()}
$('tCb').onclick=()=>setOpt('cb',!OPT.cb);$('tRelax').onclick=()=>setOpt('relax',!OPT.relax);
$('bSet').onclick=()=>{buildSettings();$('settings').classList.remove('hide')};$('bSetOk').onclick=()=>$('settings').classList.add('hide');
// colorblind shapes: ● blue, ▲ pink, ■ yellow, ✚ green
function drawPat(c,x,y,s,dark){ctx.save();ctx.beginPath();
  if(c==='blue')ctx.arc(x,y,s*.48,0,7);
  else if(c==='pink'){ctx.moveTo(x,y-s*.55);ctx.lineTo(x+s*.58,y+s*.45);ctx.lineTo(x-s*.58,y+s*.45);ctx.closePath()}
  else if(c==='yellow')ctx.rect(x-s*.42,y-s*.42,s*.84,s*.84);
  else{const a=s*.17,b=s*.52;[[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]].forEach(([dx,dy],i)=>i?ctx.lineTo(x+dx,y+dy):ctx.moveTo(x+dx,y+dy));ctx.closePath()}
  ctx.lineWidth=Math.max(1.2,s*.13);ctx.fillStyle=dark?'rgba(20,10,0,.72)':'rgba(255,255,255,.95)';ctx.strokeStyle=dark?'rgba(255,255,255,.85)':'rgba(0,0,0,.55)';ctx.stroke();ctx.fill();ctx.restore()}
// ----- dates & daily streak -----
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
function streakInfo(){const s=LS.get('fb_streak',{});if(!s.last)return {n:0,state:'none'};const d=dayNum(today())-dayNum(s.last);
  return d<=0?{n:s.n,state:'today'}:d===1?{n:s.n,state:'keep'}:{n:0,state:'broken'}}
const STREAK_REW={3:null,7:'neon',14:'candy',30:'gems'}; // every milestone also gives a golden boost
const styleOK=s=>topScore()>=s.need||LS.get('fb_unlocks',[]).includes(s.k);
const getBoost=()=>+localStorage.getItem('fb_boost')||0,addBoost=n=>localStorage.setItem('fb_boost',Math.max(0,getBoost()+n));
// called when a daily-challenge game ends; returns what happened for the game-over screen

function goHome(){cancelFace();try{clearInterval(restI)}catch(e){}document.querySelectorAll('.ov').forEach(o=>{if(o.id!=='start')o.classList.add('hide')});try{overState=null}catch(e){}toMenu();camStop();try{setMsg(null)}catch(e){}}
// tapping Touch while the face model is still loading cancels the face start and turns the camera off
$('bTouch').addEventListener('click',()=>{if(stream||window.__faceGen){cancelFace();camStop()}},true);
let askFrom=null;
function askQuit(from){if(running&&S&&!S.ended&&!paused)doPause();if(!running||!S||S.ended){goHome();return}askFrom=from;$('bQuitNo').textContent=t(from==='pause'?'quitNoP':'quitNo');$('quitAsk').classList.remove('hide')}
$('bHome').onclick=()=>askQuit('home');
$('bQuit').onclick=()=>askQuit('pause');
$('bQuitYes').onclick=goHome;
$('bQuitNo').onclick=()=>{$('quitAsk').classList.add('hide');if(askFrom==='home')$('bResume').click();askFrom=null};
// hardware/system back: returns true when handled, false at the start screen (caller exits the app)
function navBack(){if(vis('ad'))return true;
 if(vis('quitAsk')){$('bQuitNo').click();return true}
 for(const id of ['camEx','howto','styles','settings','missions'])if(vis(id)){closeOv(id);return true}
 if(vis('cont')){$('bContNo').click();return true}
 if(vis('over')){$('bMenu').click();return true}
 if(vis('calib')||vis('rest')){goHome();return true}
 if(vis('pause')){askQuit('pause');return true}
 if(running&&S&&!S.ended){doPause();return true}
 if(vis('start')&&stream){goHome();return true} // face start still loading: cancel it, camera off
 return false}
{const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
 if(CapApp&&CapApp.addListener)CapApp.addListener('backButton',()=>{if(!navBack())CapApp.exitApp()})}
addEventListener('keydown',e=>{if(e.key==='Escape')navBack()});
window.__nav={navBack,goHome,askQuit,vis};
applyLang();
</script></body></html>
