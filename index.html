      ctx.fillStyle=col;ctx.globalAlpha=.4;rr(W/2-w/2,iy-14,Math.max(28,w*prog),28,14);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.fillText(txt,W/2,iy+1)}
    if(!faceSeen){ctx.textAlign='center';ctx.fillStyle='#f88';ctx.font='14px sans-serif';ctx.fillText(t('noFace'),W/2,H*.45)}}
  drawHud()}
document.documentElement.style.setProperty('--sat','env(safe-area-inset-top)');
let defBtnOn=false;function syncDefuseBtn(){const on=running&&mode==='touch'&&!paused&&bombFalling();if(on!==defBtnOn){defBtnOn=on;if(on)$('bDefuse').style.top=Math.round(S.deadY-58)+'px';$('bDefuse').classList.toggle('hide',!on)}}
function step(now){requestAnimationFrame(step);syncDefuseBtn();const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!running)return;updateInput(dt);if(!paused&&!S.ended)update(dt);if(running)draw()}

// ---------- Styles screen ----------
function buildStyles(){const g=$('styleGrid');g.innerHTML='';const ts=topScore();
  for(const s of STYLES){const bt=document.createElement('button'),c=document.createElement('canvas');c.width=280;c.height=120;bt.appendChild(c);
    const lb=document.createElement('span');lb.textContent=ts>=s.need?t(s.n):t(s.n)+' '+t('needPts',{n:s.need});bt.appendChild(lb);
    bt.disabled=ts<s.need;if(style===s.k)bt.classList.add('sel');bt.onclick=()=>{style=s.k;localStorage.setItem('fb_style',style);buildStyles()};g.appendChild(bt);
    const c2=c.getContext('2d');c2.scale(2,2);const o=ctx;ctx=c2;
    try{drawBrick(38,8,62,22,'blue','normal',s.k);drawBrick(102,8,62,22,'pink','normal',s.k);drawBrick(38,34,62,22,'yellow','normal',s.k);drawBrick(102,34,62,22,'green','normal',s.k)}finally{ctx=o}}}
$('bStyle').onclick=()=>{buildStyles();$('styles').classList.remove('hide')};$('bStyleOk').onclick=()=>$('styles').classList.add('hide');

// ---------- Start / calibration / camera lifecycle ----------
const SECURE=window.isSecureContext&&location.protocol!=='file:';
if(!SECURE)setMsg('needHttps',{p:location.protocol});
async function startFace(){
  if(!SECURE){setMsg('blockedHttps',{p:location.protocol});return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMsg('noCamApi');return}
  setMsg('startingCam');if(!await camStart(true))return;
  try{const iv=setInterval(()=>{msgState=null;$('msg').innerHTML='<small>'+t('loadingModel')+' ('+modelStatus+')</small>'},200);try{await initFace()}finally{clearInterval(iv)}}
  catch(e){setMsg('loadFail',{e:e.message});camStop();return}
  setMsg(null);mode='face';faceLoopOn=true;faceLoop();$('start').classList.add('hide');if(forceCal||!loadCal())await calibrate();forceCal=false;begin(false)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let stream=null,camWanted=false,prevOn=localStorage.getItem('fb_prev')!=='0';
function updInd(){video.classList.toggle('off',!prevOn);$('bPrev').classList.toggle('hide',!stream);$('camNote').classList.toggle('hide',!stream||!prevOn);$('camInd').classList.toggle('hide',!stream);$('camResume').classList.toggle('hide',!(camWanted&&!stream&&mode==='face'&&running&&S&&!S.ended&&!paused))}
async function camStart(first){if(stream)return true;
  try{camStatus='requesting';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.muted=true;video.setAttribute('playsinline','');video.srcObject=stream;video.classList.remove('hide');await video.play();
    if(video.readyState<2)await new Promise(r=>video.addEventListener('loadeddata',r,{once:true}));
    camStatus='playing';camWanted=true;lastVT=-1;if(landmarker&&!faceLoopOn){faceLoopOn=true;faceLoop()}updInd();return true}
  catch(e){stream=null;camStatus='error '+e.name;if(first)setMsg('camErr',{e:e.name+' '+(e.message||'')});updInd();return false}}
function camStop(){faceLoopOn=false;faceSeen=false;bs={};if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}
  video.srcObject=null;video.classList.add('hide');if(camStatus==='playing')camStatus='stopped';updInd()}
const camResume=()=>{if(mode==='face'&&camWanted&&running&&!S.ended&&!paused&&!document.hidden)camStart()};
// samplers used by calibration
async function sampleLv(ms,fn){const v=[];let y=0,yn=0;const end=performance.now()+ms;while(performance.now()<end){if(faceSeen){v.push(fn());y+=yaw;yn++}await wait(33)}
  v.sort((a,b)=>a-b);return {p90:v.length?v[Math.floor(v.length*.9)]:0,max:v.length?v[v.length-1]:0,yaw:yn?y/yn:0,n:yn}}
async function sampleBase(ms){const acc={},n={};let y=0,yn=0;const end=performance.now()+ms;while(performance.now()<end){if(faceSeen){for(const k in bs){acc[k]=(acc[k]||0)+bs[k];n[k]=(n[k]||0)+1}y+=yaw;yn++}await wait(40)}
  const o={};for(const k in acc)o[k]=Math.min(.5,acc[k]/n[k]);return {base:o,yaw:yn?y/yn:0,n:yn}} // capped so a held expression can't disable a gesture
const CAL_KEY='fb_cal_v2';let forceCal=false;
function saveCal(){try{localStorage.setItem(CAL_KEY,JSON.stringify({v:2,base,yaw0,yawR,TH,sens,t:Date.now()}))}catch(e){}}
function loadCal(){try{const c=JSON.parse(localStorage.getItem(CAL_KEY)||'null');if(!c||c.v!==2||!c.base)return false;
  base=c.base;yaw0=c.yaw0||0;yawR=c.yawR||0;yawRef=yaw0;TH={...TH_DEF,...(c.TH||{})};if(!c.yawR&&TH.puff>TH_DEF.puff)TH.puff=TH_DEF.puff;if(c.sens)sens=c.sens;$('sens').value=sens;return true}catch(e){return false}}
// per-user threshold: ~55% of the player's own peak, kept between 60% and 180% of the default
const fitTH=(k,peak)=>peak<TH_DEF[k]*.6?TH_DEF[k]*.8:Math.max(TH_DEF[k]*.6,Math.min(TH_DEF[k]*1.8,peak*.55));
async function calibrate(){
  $('calib').classList.remove('hide');const T=$('cText'),I=$('cIcon');
  I.textContent='😐';calState={text:'findFace'};T.textContent=t('findFace');
  const t0=performance.now();while(!faceSeen&&performance.now()-t0<8000)await wait(100);
  if(!faceSeen){calState={text:'noFaceCal'};T.textContent=t('noFaceCal');await wait(2500)}
  const STEP=3000,total=7;let si=0;TH={...TH_DEF};
  async function stepRun(title,icon,sampler){si++;calState={text:title,step:{i:si,n:total}};T.textContent=t(title);I.textContent=icon;$('cStep').textContent=t('stepOf',calState.step);
    sfx.beep(false);let lastSec=3;const s0=performance.now();const tick=setInterval(()=>{const e=performance.now()-s0;const sec=Math.max(1,Math.ceil((STEP-e)/1000));if(sec<lastSec){lastSec=sec;sfx.beep(false)}$('cBar').style.width=Math.min(100,e/STEP*100)+'%';$('cCount').textContent=sec},50);
    const r=await sampler(STEP);clearInterval(tick);$('cBar').style.width='100%';sfx.beep(true);await wait(350);return r}
  const b=await stepRun('c1','😐',sampleBase);yaw0=b.yaw;base=b.base;
  const hd=await stepRun('c2','↔️',ms=>sampleLv(ms,()=>Math.abs(yaw-yaw0)));if(hd.n&&hd.p90>.05)yawR=hd.p90;yawRef=yaw0;
  const bl=await stepRun('c3','😑',ms=>sampleLv(ms,LV.blink));if(bl.n)TH.blink=fitTH('blink',bl.max);
  for(const [k,c,ic] of [['jaw','c4','😮'],['smile','c5','😁'],['brow','c6','🤨'],['puff','c7','😤']]){const r=await stepRun(c,ic,ms=>sampleLv(ms,LV[k]));if(r.n)TH[k]=k==='puff'?(r.p90<TH_DEF.puff*.6?TH_DEF.puff*.8:Math.max(TH_DEF.puff*.5,Math.min(TH_DEF.puff*1.3,r.p90*.4))):fitTH(k,r.p90)}
  $('cCount').textContent='';$('cStep').textContent='';calState={};saveCal();$('calib').classList.add('hide')}
function begin(again){$('start').classList.add('hide');$('bPause').classList.remove('hide');$('touch').classList.toggle('hide',mode!=='touch');
  newGame();gestureQ=[];GE.cur=null;GE.blinks=[];DEF.t=0;DEF.prog=0;yawRef=yaw0;running=true;paused=false;last=performance.now();if(again)camResume()}
$('bFace').onclick=startFace;
const HOW_KEY='fb_howto_v1';
function showHow(){$('howto').classList.remove('hide');$('howto').scrollTop=0}
$('bHow').onclick=showHow;$('bHowP').onclick=showHow;
$('bHowOk').onclick=()=>{localStorage.setItem(HOW_KEY,'1');$('howto').classList.add('hide')};
if(!localStorage.getItem(HOW_KEY))showHow();
let restI;
function startRest(){paused=true;camStop();let n=15;$('rest').classList.remove('hide');$('restT').textContent=n;clearInterval(restI);restI=setInterval(()=>{n--;$('restT').textContent=n;if(n<=0)endRest()},1000)}
function endRest(){clearInterval(restI);$('rest').classList.add('hide');paused=false;last=performance.now();camResume()}
$('bSkip').onclick=endRest;
function doPause(){if(!running||S.ended||paused)return;paused=true;camStop();$('pause').classList.remove('hide')}
$('bPause').onclick=doPause;
$('bResume').onclick=()=>{$('pause').classList.add('hide');paused=false;last=performance.now();camResume()};
$('bQuit').onclick=toMenu;
$('bVol').textContent=volIcon();$('bVol').onclick=e=>{e.stopPropagation();cycleVol();sfx.beep(true)};
const sl=$('sens');sl.value=sens;sl.oninput=()=>{sens=+sl.value;localStorage.setItem('fb_sens',sens);if(localStorage.getItem(CAL_KEY))saveCal()};
function syncHud(){$('sensBox').classList.toggle('hide',!hudOn)}syncHud();
$('bHud').onclick=()=>{hudOn=!hudOn;localStorage.setItem('fb_hud',hudOn?'1':'0');syncHud()};
$('bRecalStart').onclick=()=>{forceCal=true;startFace()};
$('bRecalAuto').onclick=async()=>{$('bRecalAuto').classList.add('hide');noFaceT=0;paused=true;await calibrate();paused=false;last=performance.now()};
$('bRecal').onclick=async()=>{if(mode!=='face'||!stream)return;paused=true;await calibrate();paused=false;last=performance.now()};
$('bTouch').onclick=()=>{mode='touch';begin(false)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){camStop();if(running)paused=true}else{if($('rest').classList.contains('hide')&&$('calib').classList.contains('hide')&&$('pause').classList.contains('hide'))paused=false;last=performance.now();camResume()}updInd()});
addEventListener('pagehide',camStop);addEventListener('pageshow',e=>{if(e.persisted)camResume()});
$('camResume').onclick=()=>camStart();
$('bPrev').onclick=()=>{prevOn=!prevOn;localStorage.setItem('fb_prev',prevOn?'1':'0');updInd()};
newGame();draw();requestAnimationFrame(step);
// test hooks
window.__fb={get S(){return S},begin,gameOver,gesture:g=>gestureQ.push(g),get running(){return running},faceGestures,defuseDetect,GE,DEF,setBs:v=>{bs=v;faceSeen=true},setYaw:v=>{yaw=v},setMode:m=>{mode=m},get yawRef(){return yawRef},setStyle:s=>style=s};
